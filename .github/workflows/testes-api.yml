name: Git Flow - Testes de API

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes de API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npm test
        env:
          BASE_URL: https://serverest.dev

      - name: Gerar relatório PDF
        if: always()
        run: npm run report:pdf
        continue-on-error: true
        env:
          CI: true
          BASE_URL: https://serverest.dev
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Disponibilizar PDF para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-api-${{ github.run_number }}
          path: reports/pdf/relatorio-testes-api.pdf
          if-no-files-found: warn
          retention-days: 30
