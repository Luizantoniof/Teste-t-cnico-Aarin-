```yaml
name: Git Flow - Testes de API

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'

  pull_request:
    branches:
      - master
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Qualidade do código
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar ESLint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

  testes-api:
    name: Testes de API com Cypress
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes da API
        run: npm test
        env:
          BASE_URL: https://serverest.dev

      - name: Gerar relatório Allure
        if: always()
        run: npm run report:allure
        continue-on-error: true

      - name: Gerar relatório PDF
        if: always()
        run: npm run report:pdf
        continue-on-error: true

      - name: Salvar relatórios como artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-api-${{ github.run_number }}
          path: |
            allure-report/
            allure-results/
            reports/
          retention-days: 14
          if-no-files-found: warn
```