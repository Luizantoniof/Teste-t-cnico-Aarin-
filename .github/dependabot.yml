version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    groups:
      testes:
        patterns: ['cypress', '@badeball/*', '@bahmutov/*', 'esbuild', 'cypress-on-fix']
      relatorios:
        patterns: ['allure', 'allure-*', 'puppeteer']
      qualidade:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'globals', 'prettier']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(actions)'
